<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>もちっこ育成ゲーム</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; background: #f6efe6; color: #4a3f3a;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    display: flex; justify-content: center; padding: 14px; user-select: none;
  }
  .device {
    width: 100%; max-width: 380px; background: #fffaf3; border-radius: 28px;
    box-shadow: 0 6px 24px rgba(120, 90, 60, 0.15); padding: 16px; border: 3px solid #f0d9c0;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
  .name { font-size: 20px; font-weight: bold; word-break: break-all; }
  .gen { font-size: 12px; color: #8a7a70; font-weight: normal; margin-left: 4px; }
  .meta { font-size: 12px; color: #8a7a70; text-align: right; line-height: 1.5; white-space: nowrap; }
  .room {
    position: relative; height: 230px; border-radius: 18px; overflow: hidden;
    background: linear-gradient(#e7f4ff 0%, #f3f9ff 60%, #e9dccb 60%, #e2d2bd 100%);
    transition: filter 0.6s;
  }
  .room.night { filter: brightness(0.45) saturate(0.6); }
  .glow {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 65%, rgba(255, 236, 160, 0.95) 0%, rgba(255, 220, 240, 0.5) 35%, rgba(255,255,255,0) 70%);
  }
  .glow.on { animation: glow 2.6s ease-out 1; }
  @keyframes glow { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
  .pet { position: absolute; left: 50%; bottom: 10px; width: 175px; height: 175px; transform: translateX(-50%); }
  .pet svg { width: 100%; height: 100%; }
  .bob { animation: bob 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
  .wobble { animation: wobble 2.2s ease-in-out infinite; transform-origin: 50% 90%; }
  .still { animation: breathe 3.5s ease-in-out infinite; transform-origin: 50% 100%; }
  .sway { animation: sway 2.8s ease-in-out infinite; transform-origin: 50% 100%; }
  .hop { animation: hop 0.5s ease-out 2; transform-origin: 50% 100%; }
  .munch { animation: munch 0.35s ease-in-out 3; transform-origin: 50% 100%; }
  .shiver { animation: shiver 0.15s linear 8; }
  .wiggle { animation: wiggle 0.4s ease-in-out 2; transform-origin: 50% 100%; }
  @keyframes bob { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-6px) scaleY(1.03); } }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
  @keyframes breathe { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.97); } }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes hop { 0% { transform: translateY(0); } 40% { transform: translateY(-22px); } 100% { transform: translateY(0); } }
  @keyframes munch { 0%,100% { transform: scale(1,1); } 25% { transform: scale(1.06,0.92); } 50% { transform: scale(0.96,1.04); } 75% { transform: scale(1.05,0.94); } }
  @keyframes shiver { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-7deg); } 70% { transform: rotate(7deg); } }
  .poops { position: absolute; right: 14px; bottom: 10px; display: flex; gap: 4px; }
  .bubble {
    position: absolute; left: 12px; top: 12px; right: 12px; background: #fff; border-radius: 14px;
    padding: 8px 12px; font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); min-height: 36px;
    transition: opacity 0.3s; z-index: 2;
  }
  .bubble:empty { opacity: 0; }
  .bubble.important { background: #fff6d8; box-shadow: 0 0 0 2px #f2c063, 0 2px 6px rgba(0,0,0,0.08); font-weight: bold; }
  .elder { animation: elder 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes elder { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-3px) rotate(-1.5deg); } 70% { transform: translateY(-2px) rotate(1.5deg); } }
  .nod { animation: nod 0.6s ease-in-out 2; transform-origin: 50% 100%; }
  @keyframes nod { 0%,100% { transform: rotate(0); } 50% { transform: rotate(4deg) translateY(2px); } }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 14px 2px; }
  .stat .lbl { font-size: 12px; color: #8a7a70; display: flex; justify-content: space-between; }
  .bar { height: 10px; background: #f0e4d6; border-radius: 6px; overflow: hidden; margin-top: 3px; }
  .bar i { display: block; height: 100%; border-radius: 6px; transition: width 0.4s; }
  .life { font-size: 12px; color: #8a7a70; margin: -4px 2px 10px; }
  .life .bar i { background: linear-gradient(90deg, #ffd6a8, #f0a8c8, #b8a8e8); }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  button {
    font: inherit; color: #4a3f3a; background: #ffe9d2; border: 2px solid #f2cfa8; border-radius: 14px;
    padding: 10px 4px; font-size: 14px; cursor: pointer;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.4; }
  .actions button .ic { display: block; font-size: 20px; line-height: 1.2; }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 6px; }
  .footer button { font-size: 12px; padding: 6px 8px; background: #f4ece2; border-color: #e5d6c4; white-space: nowrap; flex: 1; }
  .modal {
    position: fixed; inset: 0; background: rgba(60, 40, 30, 0.45); display: flex;
    align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .modal.hidden { display: none; }
  .card { background: #fffaf3; border-radius: 20px; padding: 20px; width: 100%; max-width: 340px; text-align: center; max-height: 92vh; overflow-y: auto; }
  .card h2 { font-size: 18px; margin: 0 0 10px; }
  .card p { font-size: 14px; color: #6a5a50; margin: 6px 0 14px; line-height: 1.6; }
  .card input {
    font: inherit; width: 100%; padding: 10px; border-radius: 12px; border: 2px solid #f2cfa8;
    margin-bottom: 12px; text-align: center; font-size: 16px; background: #fff;
  }
  .row { display: flex; gap: 10px; justify-content: center; }
  .row button { flex: 1; }
  .big { font-size: 28px; padding: 14px; }
  .zgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
  .zcell {
    background: #fff; border: 2px solid #f0e0cc; border-radius: 12px; padding: 4px 2px; cursor: pointer;
    font-size: 10px; line-height: 1.3; min-height: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .zcell svg { width: 52px; height: 52px; }
  .zcell.unknown { color: #c8b8a8; font-size: 22px; background: #f7f1ea; }
  .zcell.sel { border-color: #f0a868; }
  .zstage { font-size: 12px; color: #8a7a70; text-align: left; margin-top: 10px; }
  .zdetail { background: #fff; border-radius: 12px; padding: 10px; font-size: 13px; min-height: 52px; text-align: left; line-height: 1.6; }
  .zdetail .sub { color: #8a7a70; }
  .hist { text-align: left; font-size: 12px; color: #6a5a50; line-height: 1.7; margin-top: 10px; }
  .travelPet { width: 150px; height: 150px; margin: 0 auto; }
  .travelPet svg { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="device">
  <div class="top">
    <div class="name"><span id="petName">もちっこ</span><span class="gen" id="genLbl"></span></div>
    <div class="meta"><span id="stageLbl">たまご</span><br><span id="ageLbl">0分</span>・<span id="weightLbl">10g</span></div>
  </div>
  <div class="room" id="room">
    <div class="glow" id="glow"></div>
    <div class="bubble" id="bubble"></div>
    <div class="pet"><div id="petWrap" class="bob"></div></div>
    <div class="poops" id="poops"></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="lbl"><span>おなか</span><span id="vHunger"></span></div><div class="bar"><i id="bHunger" style="background:#ffb36b"></i></div></div>
    <div class="stat"><div class="lbl"><span>ごきげん</span><span id="vHappy"></span></div><div class="bar"><i id="bHappy" style="background:#ff8fab"></i></div></div>
    <div class="stat"><div class="lbl"><span>げんき</span><span id="vEnergy"></span></div><div class="bar"><i id="bEnergy" style="background:#7cc6a4"></i></div></div>
    <div class="stat"><div class="lbl"><span>きれい</span><span id="vClean"></span></div><div class="bar"><i id="bClean" style="background:#8fb8ff"></i></div></div>
  </div>
  <div class="life"><div style="display:flex;justify-content:space-between"><span>たびだちまで</span><span id="lifeLbl"></span></div><div class="bar"><i id="bLife"></i></div></div>
  <div class="actions">
    <button data-act="feed"><span class="ic">🍙</span>ごはん</button>
    <button data-act="snack"><span class="ic">🍡</span>おやつ</button>
    <button data-act="play"><span class="ic">🎈</span>あそぶ</button>
    <button data-act="sleep" id="sleepBtn"><span class="ic">💡</span><span id="sleepLbl">でんき</span></button>
    <button data-act="clean"><span class="ic">🧹</span>そうじ</button>
    <button data-act="medicine"><span class="ic">💊</span>くすり</button>
  </div>
  <div class="footer">
    <button id="speedBtn">⏩ 時間 ×1</button>
    <button id="zukanBtn">📖 ずかん</button>
    <button id="resetBtn">はじめから</button>
  </div>
</div>

<div class="modal hidden" id="nameModal">
  <div class="card">
    <h2 id="nameTitle">たまごを見つけた！</h2>
    <p>なまえをつけてあげよう</p>
    <input id="nameInput" maxlength="10" value="もちっこ">
    <button id="nameOk" style="width:100%">きめた！</button>
  </div>
</div>

<div class="modal hidden" id="gameModal">
  <div class="card">
    <h2>どっちむくかな？</h2>
    <p id="gameMsg">あてたらよろこぶよ（5かい）</p>
    <div class="row">
      <button class="big" data-dir="L">←</button>
      <button class="big" data-dir="R">→</button>
    </div>
    <p id="gameScore" style="margin-top:12px">0 / 5</p>
  </div>
</div>

<div class="modal hidden" id="confirmModal">
  <div class="card">
    <h2>はじめからやりなおす？</h2>
    <p>いまの子とはおわかれになります（ずかんは消えません）</p>
    <div class="row">
      <button id="confirmNo">やめる</button>
      <button id="confirmYes">やりなおす</button>
    </div>
  </div>
</div>

<div class="modal hidden" id="zukanModal">
  <div class="card">
    <h2>もちっこずかん <span id="zCount" style="font-size:14px;color:#8a7a70"></span></h2>
    <div id="zBody"></div>
    <div class="zdetail" id="zDetail">マスをタップするとくわしく見られます</div>
    <div class="hist" id="zHist"></div>
    <button id="zClose" style="width:100%;margin-top:12px">とじる</button>
  </div>
</div>

<div class="modal hidden" id="travelModal">
  <div class="card">
    <h2>たびだちの日</h2>
    <div class="travelPet" id="travelPet"></div>
    <p id="travelMsg"></p>
    <button id="travelOk" style="width:100%">あたらしいたまごをむかえる</button>
  </div>
</div>

  // 進化のしきい値（シミュレーションで調整した値）

    manmaru: ['kagami', 'kinako', 'hinata', 'nekoro'],
    gutara:  ['nekoro', 'hinata', 'kagami', 'choiwaru'],
    itazura: ['choiwaru', 'tatsujin', 'nekoro', 'kinako'],
  };
  const STYLES = ['play', 'sweet', 'rest', 'heavy', 'cared', 'balanced'];

  // ===== 小さな道具 =====
  const clamp = (v, lo = 0, hi = 100) => Math.max(lo, Math.min(hi, v));
  const clamp01 = v => clamp(v, 0, 1);
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  function gauss(rng) { let u = 0, v = 0; while (u === 0) u = rng(); while (v === 0) v = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  const stageAt = age => STAGES.find(s => age < s.until) || { id: 'end', name: 'たびだち' };
  const stageOfForm = id => (FORMS[id] ? FORMS[id].st : null);
  function cleanName(n) {
    const s = (typeof n === 'string' ? n : '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 10);
    return s || 'もちっこ';
  }
  const newSt = w => ({ t: 0, wq: 0, q: 0, neg: 0, feed: 0, snack: 0, play: 0, sleepT: 0, on: 0, hs: 0, ht: 0, w0: w || 10 });
  const newLastAct = () => ({ feed: -1e9, snack: -1e9, play: -1e9 });
  function fresh(name, gen, speed) {
    return { v: 3, name: cleanName(name), gen: Math.max(1, Math.floor(num(gen, 1))), age: 0, last: Date.now(),
             hunger: 80, happy: 80, energy: 100, poop: 0, sick: false, asleep: false, weight: 10,
             form: null, childForm: null, adultX: null, departed: false, title: null,
             speed: SPEEDS.includes(speed) ? speed : 1, lastSnack: -9999, careLeft: 0, lastAct: newLastAct(),
             adultForm: null, style: null, awayGrew: false, wasAway: false, grace: 0, prevSt: null, st: newSt(10) };
  }
  const cleanVal = S => clamp(100 - S.poop * 30);
  // お世話の行き届き具合（0〜100）。おなか・ごきげん・きれい・休息
  const careIndex = S => 0.4 * S.hunger + 0.4 * S.happy + 0.1 * cleanVal(S) + 0.1 * Math.min(100, S.energy + 40);

  // ===== 進化判定 =====
  // 年代全体の「お世話の行き届き具合」。留守中は重みを下げ、放置の負担を差し引く。
  // 小さな個体差（標準偏差4）を加え、境界で結果がガタッと変わらないようにする。
  function stageScore(S, rng) {
    const st = S.st;
    const Q = st.wq > 0 ? st.q / st.wq : 70;
    return Q - st.neg * 0.8 + gauss(rng) * 4;
  }
  // 育て方の個性（それぞれ0〜1）。ボタンの連打より「何を中心にお世話したか」の割合を見る。
  function traits(S) {
    // この年代の記録に、ひとつ前の年代の傾向を半分だけ足す（留守が長くても、その子らしさが残る）
    const pv = S.prevSt || {}, st = S.st;
    const feed = st.feed + 0.5 * (pv.feed || 0), snack = st.snack + 0.5 * (pv.snack || 0), play = st.play + 0.5 * (pv.play || 0);
    const food = feed + snack, all = food + play;
    return {
      play:  all >= 3 ? play / all : 0,
      sweet: food >= 3 ? snack / food : 0,
      // たくさん食べたか：おなかをどれだけ満たしていたか ＋ 1時間あたりの体重の増え方
      heavy: clamp01(0.5 * clamp01(((st.ht > 0 ? st.hs / st.ht : 60) - 65) / 25)
                   + 0.5 * clamp01(((S.weight - st.w0) / Math.max(0.5, st.t / 3600) - 1.5) / 2)),
      rest:  st.t > 0 ? clamp01((st.sleepT / st.t - 0.07) / 0.2) : 0,
    };
  }
  const evidence = S => S.st.feed + S.st.snack + S.st.play;   // この年代のお世話の記録の量（連打は数えすぎない）
  // 候補ごとの「なりやすさ」に小さな揺らぎを足して、いちばん高いものを選ぶ
  // sigma: 個体差の大きさ。いっしょに過ごした時間が短いほど、その子の個性（個体差）が強く出る
  function choose(cands, rng, sigma) {
    let best = null, bv = -Infinity;
    for (const k of Object.keys(cands)) { const v = cands[k] + gauss(rng) * sigma; if (v > bv) { bv = v; best = k; } }
    return best;
  }
  // こども：お世話がほとんど届かなかったら しょんぼりもち。
  // それ以外は「お世話の行き届き具合」と「ごはん中心か、あそび中心か」で まるもち / ぷちもち が分かれる。
  function decideChild(S, rng) {
    const X = stageScore(S, rng);
    if (X < TH.puchi) return 'shobon';
    const st = S.st, food = st.feed + st.snack, all = food + st.play;
    const lean = all >= 1.5 ? food / all : 0.55;          // 1 = ごはん・おやつ中心、0 = あそび中心
    const m = (X - 64) / 60 + 2.2 * (lean - 0.8) + gauss(rng) * 0.4;   // ごはん中心ほど まるもち、あそびが多いほど ぷちもち
    return m > 0 ? 'maru' : 'puchi';
  }
  function decideAdult(S, rng) {
    const X = stageScore(S, rng);
    let base = TREE[S.childForm] ? S.childForm : 'puchi';
    // こども期のお世話しだいで、上のルート・下のルートに移れる（取り返しがつく）。
    // ただし、いっしょに過ごした時間が短いとき（留守が長かったとき）はルートを変えない。
    if (S.st.on >= MIN_TOGETHER) {
      const st = S.st, food = st.feed + st.snack, lean = (food + st.play) >= 1.5 ? food / (food + st.play) : 0.5;
      if (base === 'puchi' && X >= TH.upToMaru && lean >= 0.75) base = 'maru';   // ごはん中心でとても大事にされたら まるもちルートへ
      else if (base === 'shobon' && X >= TH.upToPuchi) base = 'puchi';

      else if (base === 'puchi' && X < TH.downFromPuchi) base = 'shobon';

    const P = t.play - 0.2, W = t.sweet - 0.3;
    if (base === 'maru') c = { fuwa: 0.62, kira: 0.3 + 2.2 * P + Math.min(0.2, Math.max(0, (X - 72) / 60)), ama: 0.3 + 2.4 * W };
    else if (base === 'puchi') c = { nonbiri: 0.45 + 1.1 * t.rest, genki: 0.3 + 2.0 * P, manmaru: 0.2 + 1.3 * t.heavy + 0.8 * W };
    else c = { gutara: 0.5 + 0.8 * t.rest, itazura: 0.3 + 1.7 * P };

  // ご長寿：おとな期の育て方で、4つの候補から決まる。
  // 過去に同じ「おとな→ご長寿」の組み合わせが続いていたら少しなりにくくし、育て直しでも違う展開を楽しめるようにする。
  function decideSenior(S, rng, memory) {
    const X = stageScore(S, rng);

    // 「ふつう」との差で見て、ひとつの傾向が強くききすぎないようにする
    const cap = v => Math.max(-0.4, Math.min(0.5, v));
    const aff = {
      wata:     0.4 + 0.3 * bal,
      hoshi:    0.15 + 0.7 * q,
      kinako:   0.3 + cap(1.3 * (t.sweet - 0.3)),
      tatsujin: 0.3 + cap(1.3 * (t.play - 0.2)),
      hinata:   0.3 + cap(1.0 * (t.rest - 0.2)),
      kagami:   0.3 + cap(0.8 * (t.heavy - 0.5)),
      nekoro:   0.25 + cap(0.6 * (t.rest - 0.2)) + 0.35 * (1 - q),
      choiwaru: 0.25 + cap(0.6 * (t.play - 0.2)) + 0.35 * (1 - q),
    };

    const pairs = (memory && Array.isArray(memory.pairs)) ? memory.pairs.slice(0, 10) : [];
    const seen = (memory && memory.seen) || {};

      v -= Math.min(0.36, 0.12 * repeats);            // 同じ組み合わせが続くと、少しなりにくい

    return { form: choose(c, rng, 0.28 + 0.2 * (1 - clamp01(evidence(S) / 6))), style };
  }

  function transition(S, now, rng, ev, offline, memory) {
    const from = S.form;

    else if (now === 'adult') { const r = decideAdult(S, rng); S.form = r.form; S.adultX = r.X; S.adultForm = r.form; }

    ev.push({ type: 'evolve', from, to: S.form, stage: now, offline });
  }

  // ===== 時間を進める =====
  function stepOnce(S, dt, offline, rng, ev, realPerSim, noAge, memory) {
    const prev = stageAt(S.age).id;
    if (!noAge) S.age += dt;
    if (prev !== 'egg') {
      const m = MULT[prev] || MULT.adult;
      const slow = S.asleep ? 0.4 : 1, off = offline ? OFFLINE.decay : 1;
      // うんち・病気が重なっても、ごきげんの減りは最大1.6倍まで

      const h0 = S.hunger, p0 = S.happy;

      if (offline) { h = Math.max(h, Math.min(h0, OFFLINE.floor)); p = Math.max(p, Math.min(p0, OFFLINE.floor)); }
      S.hunger = h; S.happy = p;

      } else {

        const cap = offline ? OFFLINE.poopMax : 4;

      }

          const risk = (S.poop >= 3 ? 1 : 0) + (S.hunger <= 5 ? 1 : 0);   // うんち3個以上 or ぺこぺこのときだけ
          if (risk && rng() < (dt / 2400) * risk) { S.sick = true; ev.push({ type: 'sick' }); }
        }

      // お世話の評価：最後にお世話してからしばらくの間だけ、実際の状態で評価する。

      S.st.q += (active ? ci : Math.min(ci, OFFLINE.neutral)) * dt * w;

      S.st.wq += dt * w;
      S.st.t += dt;

  }

  // sec: 進めるゲーム内の秒数 / opt.offline: 留守中ルールで進めるか
  // opt.real: そのあいだに流れた現実の秒数（プレイ中。省略時は等倍とみなす）

  }

  // ===== お世話 =====
  function act(S, a) {
    const r = actInner(S, a);

  }
  // 育て方の傾向として数える。同じ種類を短時間に何度押しても、ゲーム内10分で「1回ぶん」まで。

  function countAct(S, type, eff) {

  function actInner(S, a) {
    const stage = stageAt(S.age).id;

        if (!S.poop) return { ok: false, key: 'cleanNone' };

      case 'medicine':
        if (!S.sick) return { ok: false, key: 'medicineNone' };

    }
    return { ok: false };
  }
  function playResult(S, wins) {
    S.happy = clamp(S.happy + (wins >= 3 ? 28 : 14)); S.energy = clamp(S.energy - 10);
    S.hunger = clamp(S.hunger - 5); S.weight = clamp(S.weight - 1, 5, 99); countAct(S, 'play', 1); S.careLeft = CARE_REAL;

  }

  // ===== セーブデータの検証・移行 =====
  function childOfAdult(id) { for (const k of Object.keys(TREE)) if (TREE[k].includes(id)) return k; return 'puchi'; }
  function sanitize(o, nowMs) {
    if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
    const now = num(nowMs, Date.now());
    const S = fresh(o.name, o.gen, o.speed);
    S.age = clamp(num(o.age, 0), 0, LIFE);
    S.last = num(o.last, now); if (S.last > now) S.last = now;
    S.hunger = clamp(num(o.hunger, 80)); S.happy = clamp(num(o.happy, 80)); S.energy = clamp(num(o.energy, 100));
    S.poop = Math.floor(clamp(num(o.poop, 0), 0, 4));
    S.weight = clamp(num(o.weight, 10), 5, 99);
    S.sick = o.sick === true; S.asleep = o.asleep === true; S.departed = o.departed === true;
    S.title = typeof o.title === 'string' ? o.title.slice(0, 20) : null;
    S.lastSnack = num(o.lastSnack, -9999);
    // お世話の評価の残り時間（現実の秒）。前のバージョン(ゲーム内時刻 lastCare)からも変換する
    if (typeof o.careLeft === 'number') S.careLeft = clamp(num(o.careLeft, 0), 0, CARE_REAL);

    if (o.prevSt && typeof o.prevSt === 'object') S.prevSt = { feed: Math.max(0, num(o.prevSt.feed, 0)), snack: Math.max(0, num(o.prevSt.snack, 0)), play: Math.max(0, num(o.prevSt.play, 0)) };

    S.childForm = stageOfForm(o.childForm) === 'child' ? o.childForm : null;
    S.form = FORMS[o.form] ? o.form : null;
    S.adultForm = stageOfForm(o.adultForm) === 'adult' ? o.adultForm : null;
    const st = (o.st && typeof o.st === 'object') ? o.st : null;
    const cnt = v => Math.max(0, num(v, 0));
    if (st && 'wq' in st) {
      S.st = { t: Math.max(0, num(st.t, 0)), wq: Math.max(0, num(st.wq, 0)), q: Math.max(0, num(st.q, 0)), neg: Math.max(0, num(st.neg, 0)),

  function moodExtra(m) {

  function eggSVG() {
    return wrap(`<ellipse cx="100" cy="118" rx="52" ry="66" fill="#fff4d6" stroke="#e8cf9c" stroke-width="4"/>
      <circle cx="80" cy="98" r="9" fill="#ffc9a8"/><circle cx="118" cy="128" r="12" fill="#ffc9a8"/><circle cx="95" cy="153" r="7" fill="#ffc9a8"/>`);
  }
  function drawForm(id, m) {
    const F = FORMS[id] || FORMS.baby, sh = F.sh, tint = m === 'sick' ? '#cfe3ef' : F.c;

    if (sh.stack) {
      body = `<ellipse cx="100" cy="156" rx="80" ry="32" fill="${tint}" stroke="${F.s}" stroke-width="4"/><ellipse cx="100" cy="110" rx="60" ry="36" fill="${tint}" stroke="${F.s}" stroke-width="4"/>`;
      g = { cx: 100, cy: 110, rx: 60, ry: 36, top: 74, fy: 104, gap: 20 };
    } else {
      body = `<ellipse cx="100" cy="${sh.cy}" rx="${sh.rx}" ry="${sh.ry}" fill="${tint}" stroke="${F.s}" stroke-width="4"/><ellipse cx="100" cy="${sh.cy + sh.ry * 0.5}" rx="${sh.rx * 0.45}" ry="${sh.ry * 0.22}" fill="#fff" opacity="0.45"/>`;
      g = { cx: 100, cy: sh.cy, rx: sh.rx, ry: sh.ry, top: sh.cy - sh.ry, fy: sh.cy - sh.ry * 0.12, gap: Math.min(sh.rx * 0.34, 26) };
    }
    g.c = tint; g.s = F.s;
    let back = '', front = '';
    (F.acc || []).forEach(a => { const s = ACC[a](g); if (BACK.has(a)) back += s; else front += s; });

  }
  const POOP = `<svg width="30" height="28" viewBox="0 0 30 28"><path d="M15 3 q4 3 1 6 q7 0 6 6 q6 1 5 7 q0 4 -6 4 h-12 q-6 0 -6 -4 q-1 -6 5 -7 q-1 -6 6 -6 q-2 -3 1 -6z" fill="#a8774f" stroke="#7d5536" stroke-width="1.5"/><circle cx="12" cy="18" r="1.3" fill="#3a2a1f"/><circle cx="18" cy="18" r="1.3" fill="#3a2a1f"/></svg>`;

  // ===== 保存・読み込み =====
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(ZKEY, JSON.stringify(Z)); } catch (e) {}
  }
  function loadState() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (raw) { try { const s = E.sanitize(JSON.parse(raw)); if (s) return s; } catch (e) {} }
    try { const r1 = localStorage.getItem(OLD_KEY); if (r1) { const s = E.migrateV1(JSON.parse(r1)); if (s) return s; } } catch (e) {}
    return null;
  }
  function loadZukan() {
    try { const r = localStorage.getItem(ZKEY); if (r) return E.sanitizeZukan(JSON.parse(r)); } catch (e) {}
    return { seen: {}, history: [] };
  }
  function discover(id) { if (id && FORMS[id] && !Z.seen[id]) { Z.seen[id] = true; return true; } return false; }

  // ===== 画面 =====
  let lastSvgKey = '', animUntil = 0;
  function fmtTime(sec) {
    const m = Math.floor(sec / 60);
    return m < 60 ? `${m}分` : `${Math.floor(m / 60)}時間${m % 60}分`;
  }
  function setAnim(cls, ms) {
    const w = $('petWrap');
    w.className = ''; void w.offsetWidth;   // アニメを最初から再生
    w.className = cls; animUntil = Date.now() + (ms || 1000);
  }
  function glow() { const g = $('glow'); g.classList.remove('on'); void g.offsetWidth; g.classList.add('on'); }
  function render() {
    const st = E.stageAt(S.age);
    $('petName').textContent = S.name;
    $('genLbl').textContent = `${S.gen}代目`;
    $('stageLbl').textContent = st.id === 'egg' ? 'たまご' : (S.form && FORMS[S.form]) ? `${S.departed ? 'ご長寿' : st.name}（${FORMS[S.form].name}）` : st.name;
    $('ageLbl').textContent = `うまれて${fmtTime(S.age)}`;
    $('weightLbl').textContent = `${Math.round(S.weight)}g`;
    [['Hunger', S.hunger], ['Happy', S.happy], ['Energy', S.energy], ['Clean', E.cleanVal(S)]].forEach(([k, v]) => {
      $('b' + k).style.width = Math.round(v) + '%'; $('v' + k).textContent = Math.round(v);
    });
    $('bLife').style.width = Math.min(100, S.age / E.LIFE * 100) + '%';
    $('lifeLbl').textContent = S.departed ? 'たびだちました' : `あと${fmtTime(Math.max(0, E.LIFE - S.age))}（ゲーム内時間）`;
    const m = mood();
    const key = st.id === 'egg' ? 'egg' : (S.form || 'baby') + ':' + m;
    const w = $('petWrap');
    if (key !== lastSvgKey) { w.innerHTML = st.id === 'egg' ? eggSVG() : drawForm(S.form || 'baby', m); lastSvgKey = key; }
    if (Date.now() >= animUntil) {
      const senior = FORMS[S.form] && FORMS[S.form].st === 'senior';
      const base = st.id === 'egg' ? 'wobble' : (S.asleep || S.sick) ? 'still' : S.energy < 20 ? 'sway' : senior ? 'elder' : 'bob';
      if (w.className !== base) w.className = base;
    }
    $('room').classList.toggle('night', S.asleep);
    $('poops').innerHTML = POOP.repeat(S.poop);
    $('sleepLbl').textContent = S.asleep ? 'おこす' : 'でんき';
    const lock = st.id === 'egg' || S.departed;
    document.querySelectorAll('.actions button').forEach(b => b.disabled = lock);
    $('speedBtn').textContent = '⏩ 時間 ' + (SPEED_LABEL[S.speed] || '×1');
    renderBubble();
  }

  // ===== 時間の進行 =====
  let awayStart = null, awayEvents = [];
  const isOpen = id => !$(id).classList.contains('hidden');
  const paused = () => isOpen('nameModal') || isOpen('gameModal') || isOpen('travelModal');
  function tick() {
    const now = Date.now();
    let el = (now - S.last) / 1000;
    S.last = now;
    if (!isFinite(el) || el < 0) el = 0;          // 時計が戻った場合など
    if (paused() || S.departed) return;            // ミニゲーム中などは時間を止める
    if (el > AWAY_SEC || document.hidden) {
      // 留守中：倍速は使わず現実の時間で、上限24時間まで、やさしいルールで進める
      if (awayStart == null) awayStart = now - el * 1000;
      const evs = E.advance(S, Math.min(el, E.OFFLINE.cap), { offline: true, memory: memo() });
      awayEvents.push(...evs.filter(e => e.type === 'evolve'));
    } else {
      if (awayStart != null) {   // 戻ってきた
        const away = (now - awayStart) / 1000;
        if (away >= 30 * 60) welcomeBack(away, awayEvents); else handleEvents(awayEvents);
        awayStart = null; awayEvents = [];
      }
      // プレイ中：ゲーム内は「現実の時間 × 速度」進む。お世話の評価時間は現実の時間（el）で減る
      handleEvents(E.advance(S, el * S.speed, { offline: false, real: el, memory: memo() }));
    }
    // ときどき性格の出るひとりごと（1倍速 40秒ごと / 20倍速 90秒ごと / 100倍速 なし）
    const chatGap = S.speed >= 100 ? Infinity : S.speed >= 20 ? 90000 : 40000;
    if (!cur && !queue.length && !needMsg() && !S.asleep && E.stageAt(S.age).id !== 'egg' && Date.now() - lastChat > chatGap) {
      sayLine('idle'); lastChat = Date.now();
      if (FORMS[S.form] && FORMS[S.form].st === 'senior') setAnim('nod', 1300);   // ご長寿は、うんうんとうなずく
    }
    save(); render();
  }
  const memo = () => ({ pairs: Z.history.slice(0, 10).map(h => ({ adult: h.adult, form: h.form })), seen: Z.seen });
  function handleEvents(evs) {
    for (const e of evs) {
      if (e.type === 'evolve') {
        lastSvgKey = '';
        const isNew = discover(e.to);
        if (e.offline) continue;   // 留守中の成長は「おかえり」でまとめて伝える
        purgeForEvolve();
        const v = VOICE[e.to];
        say(v ? v.evolve : '', { pri: P.HIGH });
        if (e.stage === 'senior') {
          glow(); setAnim('hop', 1000);
          if (FORMS[S.adultForm]) say(`むかしは${FORMS[S.adultForm].name}だったんじゃよ`, { pri: P.HIGH });
        } else setAnim('hop', 1000);
        if (isNew) say(`ずかんに「${FORMS[e.to].name}」がとうろくされた！`, { pri: P.HIGH });
      } else if (e.type === 'depart') {
        Z.history.unshift({ gen: S.gen, name: S.name, form: S.form, adult: S.adultForm, title: e.title, date: new Date().toLocaleDateString('ja-JP') });
        Z.history = Z.history.slice(0, 30);
        save(); showTravel();
      } else if (!e.offline) {
        if (e.type === 'wake') sayLine('wake');
        else if (e.type === 'fellAsleep') sayLine('fellAsleep');
        else if (e.type === 'sick') { sayLine('gotSick'); setAnim('shiver', 1200); }
        else if (e.type === 'poop' && Math.random() < 0.5) sayLine('poop');
        // ※ 100倍速では wake/fellAsleep/poop（LOW）は say() 側で省略される
      }
    }
  }
  function welcomeBack(el, evs) {
    handleEvents(evs);
    if (evs.some(e => e.type === 'evolve')) purgeForEvolve();
    sayLine(el >= 3 * 3600 ? 'greetLong' : 'greetShort');
    setAnim('hop', 1000);
    const grown = evs.filter(e => e.type === 'evolve' && FORMS[e.to] && FORMS[e.to].st !== 'baby').map(e => FORMS[e.to].name);
    if (grown.length) say(`るすのあいだに${grown[grown.length - 1]}になったよ！`, { pri: P.HIGH });
  }

  // ===== お世話 =====
  function act(a) {
    const r = E.act(S, a);
    if (r.key === 'startPlay') { startGame(); return; }
    if (r.key) sayLine(r.key);
    if (r.anim) setAnim(r.anim, 1200);
    if (r.ok && r.key === 'sleep') lastChat = Date.now();
    save(); render();
  }

  // ===== ミニゲーム（遊んでいる間は時間が止まる） =====
  let round = 0, wins = 0, busy = false;
  function startGame() {
    round = 0; wins = 0; busy = false;
    $('gameMsg').textContent = 'あてたらよろこぶよ（5かい）';
    $('gameScore').textContent = '0 / 5';
    $('gameModal').classList.remove('hidden');
  }
  document.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => {
    if (busy) return; busy = true;
    const pick = Math.random() < 0.5 ? 'L' : 'R', hit = pick === b.dataset.dir;
    if (hit) wins++; round++;
    $('gameMsg').textContent = (pick === 'L' ? '← ひだりをむいた！' : '→ みぎをむいた！') + (hit ? ' あたり！' : ' はずれ…');
    $('gameScore').textContent = `${wins} / ${round}`;
    setTimeout(() => {
      busy = false;
      if (round >= 5) {
        $('gameModal').classList.add('hidden');
        S.last = Date.now();
        const key = E.playResult(S, wins);
        say(`${wins}かいあたり！`, { pri: P.CARE, dur: 2000 }); sayLine(key);
        setAnim('hop', 1000); save(); render();
      }
    }, 700);
  }));

  // ===== ずかん（名前などは textContent で安全に表示） =====
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function openZukan() {
    const seenCount = ORDER.filter(id => Z.seen[id]).length;
    $('zCount').textContent = `${seenCount} / ${ORDER.length}`;
    const body = $('zBody'); body.textContent = '';
    [['baby', 'あかちゃん'], ['child', 'こども'], ['adult', 'おとな'], ['senior', 'ご長寿']].forEach(([st, label]) => {
      body.appendChild(el('div', 'zstage', label));
      const grid = el('div', 'zgrid');
      ORDER.filter(id => FORMS[id].st === st).forEach(id => {
        const seen = !!Z.seen[id];
        const c = el('div', seen ? 'zcell' : 'zcell unknown');
        if (seen) { c.innerHTML = drawForm(id, 'normal'); c.appendChild(el('span', null, FORMS[id].name)); }
        else c.textContent = '？';
        c.addEventListener('click', () => {
          grid.parentNode.querySelectorAll('.zcell').forEach(x => x.classList.remove('sel'));
          c.classList.add('sel');
          const d = $('zDetail'); d.textContent = '';
          const F = FORMS[id];
          d.appendChild(el('b', null, seen ? F.name : '？？？')); d.appendChild(document.createElement('br'));
          if (seen) { d.appendChild(document.createTextNode(F.desc)); d.appendChild(document.createElement('br')); }
          d.appendChild(el('span', 'sub', (seen ? '育て方：' : 'ヒント：') + F.hint));
        });
        grid.appendChild(c);
      });
      body.appendChild(grid);
    });
    $('zDetail').textContent = 'マスをタップするとくわしく見られます';
    const h = $('zHist'); h.textContent = '';
    if (Z.history.length) {
      h.appendChild(el('b', null, 'たびだった子たち'));
      Z.history.slice(0, 10).forEach(x => {
        h.appendChild(document.createElement('br'));
        h.appendChild(document.createTextNode(`${x.gen}代目 ${x.name}（${x.title}${FORMS[x.form] ? FORMS[x.form].name : ''}）${x.date}`));
      });
    }
    $('zukanModal').classList.remove('hidden');
  }
  $('zukanBtn').addEventListener('click', openZukan);
  $('zClose').addEventListener('click', () => $('zukanModal').classList.add('hidden'));

  // ===== たびだち =====
  function showTravel() {
    $('travelPet').innerHTML = drawForm(S.form || 'wata', 'happy');
    const p = $('travelMsg'); p.textContent = '';
    p.appendChild(document.createTextNode(`${S.title || ''}${FORMS[S.form] ? FORMS[S.form].name : ''}の`));
    p.appendChild(el('b', null, S.name));
    p.appendChild(document.createTextNode('は、'));
    p.appendChild(document.createElement('br'));
    p.appendChild(document.createTextNode('たびに出ていきました。'));
    p.appendChild(document.createElement('br'));
    p.appendChild(document.createTextNode(`いっしょにすごした時間：${fmtTime(S.age)}`));
    p.appendChild(document.createElement('br'));
    p.appendChild(el('span', null, `ずかん ${ORDER.filter(id => Z.seen[id]).length} / ${ORDER.length}`));
    $('travelModal').classList.remove('hidden');
    render();
  }
  $('travelOk').addEventListener('click', () => { $('travelModal').classList.add('hidden'); askName(S.gen + 1); });

  // ===== なまえ・リセット・速さ =====
  let pendingGen = 1;
  function askName(gen) {
    pendingGen = gen || 1;
    $('nameTitle').textContent = pendingGen > 1 ? `${pendingGen}代目のたまごがとどいた！` : 'たまごを見つけた！';
    $('nameModal').classList.remove('hidden');
  }
  $('nameOk').addEventListener('click', () => {
    S = E.fresh($('nameInput').value, pendingGen, S ? S.speed : 1);
    $('nameModal').classList.add('hidden');
    lastSvgKey = ''; queue.length = 0; cur = null;
    save(); render(); say('たまごがあったかい…', { pri: P.CARE });
  });
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('nameOk').click(); });
  $('resetBtn').addEventListener('click', () => $('confirmModal').classList.remove('hidden'));
  $('confirmNo').addEventListener('click', () => $('confirmModal').classList.add('hidden'));
  $('confirmYes').addEventListener('click', () => { $('confirmModal').classList.add('hidden'); askName(S ? S.gen : 1); });
  $('speedBtn').addEventListener('click', () => {
    tick();
    const i = E.SPEEDS.indexOf(S.speed);
    S.speed = E.SPEEDS[(i + 1) % E.SPEEDS.length];
    purgeForSpeed();
    save(); render();
  });
  document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.dataset.act)));

  // ===== 起動 =====
  Z = loadZukan();
  const loaded = loadState();
  if (loaded) {
    S = loaded;
    if (E.stageAt(S.age).id !== 'egg') { discover('baby'); discover(S.childForm); discover(S.form); }
    if (S.departed) { render(); showTravel(); }
    else { tick(); setTimeout(tick, 300); if (!cur && !queue.length && awayStart == null) say(`${S.name}がまってたよ！`, { pri: P.CARE }); }
    save();
  } else {
    S = E.fresh('もちっこ', 1, 1); render(); askName(1);
  }
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else tick(); });
  window.addEventListener('pagehide', save);
})();
</script>
</body>
</html>
